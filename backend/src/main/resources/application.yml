spring:
  application:
    name: ims-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/internship_management}
    username: ${DB_USERNAME:ims_user}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:11MB}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
app:
  profile-encryption-key: ${PROFILE_ENCRYPTION_KEY}
  file-storage:
    root: ${DOCUMENT_STORAGE_ROOT:./data/internship-documents}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:10485760}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    cookie-name: ${JWT_COOKIE_NAME:ims_auth}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.172.163.77:3000}
bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  students:
    emails: ${BOOTSTRAP_STUDENT_EMAILS:}
    passwords: ${BOOTSTRAP_STUDENT_PASSWORDS:}
